title: "Педагоги КГИК. 60 лет"
description: "Интерактивная книжная выставка трудов преподавателей Краснодарского государственного института культуры"
url: "https://chuxlee.github.io"
baseurl: "/golden-shelf"

collections:
  persons:
    output: true
    permalink: /persons/:name/
  works:
    output: true
    permalink: /works/:name/

defaults:
  - scope:
      path: ""
      type: "persons"
    values:
      layout: "person"
  - scope:
      path: ""
      type: "works"
    values:
      layout: "work"

markdown: kramdown
exclude:
  - README.md
